# Fleet rules only. Do not set useDefault.
# The default allowlist matches a leading /home/ path and would hide /home/hinescreative.
# scripts/precommit-gitleaks.sh runs this file, then the default secret rules.
title = "claude-peers fleet values"

[[rules]]
id = "fleet-hostname"
description = "fleet hostname"
regex = '''(?i)\b(theoldone|clarvis|clarsmini|cheesegrater|grater)\b'''
keywords = ['''theoldone''', '''clarvis''', '''clarsmini''', '''cheesegrater''', '''grater''']

[[rules]]
id = "fleet-tailnet"
description = "tailnet address in the carrier-grade range"
regex = '''\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3}\b'''
keywords = ['''100.''']

[[rules]]
id = "fleet-home"
description = "fleet home path"
regex = '''(?:/Users/wesleyhines|/home/hinescreative)'''
keywords = ['''/Users/wesleyhines''', '''/home/hinescreative''']

[[rules]]
id = "fleet-domain"
description = "fleet domain"
regex = '''hinescreative\.xyz'''
keywords = ['''hinescreative.xyz''']

[[rules]]
id = "fleet-email"
description = "fleet email"
regex = '''wes@hinescreative\.xyz'''
keywords = ['''wes@''']

[[allowlists]]
description = "the rules file names the literals it forbids"
paths = ['''(^|/)\.gitleaks\.toml$''']

[[allowlists]]
description = "source lines that already carry fleet defaults. Card 226 left them. A new line is not in this list."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)butler\-inbox\-edge\.test\.ts$''',
  '''(^|/)butler\-inbox\-edge\.ts$''',
  '''(^|/)dashboard/app\.js$''',
  '''(^|/)grok\-edge\.ts$''',
  '''(^|/)lead\-wake\-edge\.ts$''',
  '''(^|/)scripts/run\-cloudflared\.zsh$''',
  '''(^|/)scripts/run\-dashboard\.zsh$''',
  '''(^|/)wake\.test\.ts$''',
]
regexes = [
  '''^\ \ \ \ \ \ expect\(String\(url\)\)\.toBe\("http://100\.103\.170\.84:3773/api/hooks/test\-id/test\-token"\);$''',
  '''^\ \ \ \ const\ res\ =\ await\ post\(`http://100\.103\.170\.84:3773\$\{hook\}`,\ \{$''',
  '''^\ \ const\ brokerURL\ =\ \(process\.env\.CLAUDE_PEERS_BROKER_URL\ \?\?\ "http://100\.108\.57\.10:7899"\)\.replace\(/\\/\$/,\ ""\);$''',
  '''^\ \ \ \ \ \ pid:\ process\.pid,\ cwd:\ process\.cwd\(\),\ git_root:\ null,\ tty:\ null,\ machine:\ "theoldone",$''',
  '''^\ \ \ \ hostname:\ process\.env\.BUTLER_INBOX_HOST\ \?\?\ "100\.108\.57\.10",\ port:\ Number\(process\.env\.BUTLER_INBOX_PORT\ \?\?\ 8794\),$''',
  '''^\ \ imac:\ \["theoldone"\],$''',
