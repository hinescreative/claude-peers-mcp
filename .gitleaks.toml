  '''^const\ BROKER\ =\ \(process\.env\.CLAUDE_PEERS_BROKER_URL\ \?\?\ "http://100\.108\.57\.10:7899"\)\.replace\(/\\/\$/,\ ""\);$''',
  '''^const\ PEER_MACHINE\ =\ process\.env\.GROK_PEER_MACHINE\ \?\?\ "theoldone";$''',
  '''^\ \ \ \ \ \ \ \ \ \ description:\ "Optional\ machine\ filter\ \(pc,\ mac,\ clarvis,\ theoldone,\ \.\.\.\)",$''',
