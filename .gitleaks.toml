  '''^\ \ \ \ hostname:\ process\.env\.LEAD_WAKE_HOST\ \?\?\ "100\.108\.57\.10",$''',
  '''^\ \ \-\-token\-file\ /Users/wesleyhines/mcp\-servers/claude\-peers\-mcp/\.secrets/claude\-peers\-tunnel\.token$''',
